            \ the mark in. Six bullets is plenty.\n\n**6. Prompt architecture for\
            \ step 2**\nThe most important section, so spend your words here. Specify\
            \ the exact template the step-2 final prompt must follow \u2014 and state\
            \ that the finished prompt should land at **180\u2013250 words**, long\
            \ enough to carry the spec, short enough that no single instruction gets\
            \ diluted. Order it to match how the image model weights a prompt:\n\n\
            1. **Medium and style up front** \u2014 the first sentence states it is\
            \ a square black-and-white line-art mascot logo, because opening words\
            \ set the mode for everything after.\n2. **Subject** \u2014 the mascot,\
            \ its identity, expression, pose.\n3. **Key details** \u2014 props, supporting\
            \ motifs, any literal text in quotes.\n4. **Layout** \u2014 centring,\
            \ margins, hierarchy, where each element sits.\n5. **Line and manufacturing\
